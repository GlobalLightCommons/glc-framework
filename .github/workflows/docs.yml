name: Build documentation and viewer
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
on:
  push:
    branches: [main]
    paths: ["viewer/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["viewer/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: framework-docs
  cancel-in-progress: false
jobs:
  build:
    # commonmarker 0.23.x does not compile with the Ubuntu 26.04 toolchain.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: viewer
      - name: Check Sass map key compatibility
        run: bundle exec ruby tests/sass_number_equality.rb
      - run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/_site
