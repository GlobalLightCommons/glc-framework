name: Prepare metadata builder site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["builder/**", ".github/workflows/builder.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p builder_out
          cp builder/index.html builder/app.js builder/datetime-metadata.js builder/styles.css builder/navbar.css builder/CNAME builder_out/
          cp -R builder/assets builder/schemas builder_out/
          touch builder_out/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: builder-preview
          path: builder_out/
