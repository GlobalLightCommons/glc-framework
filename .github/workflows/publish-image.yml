name: Build & publish validator image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Container version to publish, without a leading "v".
        required: true
        type: string
        default: "0.6.0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version
        id: ver
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          if [[ "$version" != "$(tr -d '[:space:]' < validator/VERSION)" ]]; then
            echo "Requested version must match validator/VERSION" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set lowercase image owner
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push (multi-arch)
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: validator
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/glc-validator:${{ steps.ver.outputs.version }}
            ghcr.io/${{ env.IMAGE_OWNER }}/glc-validator:latest
      - name: Record the exact release digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = dict(version=os.environ['RELEASE_VERSION'], commit=os.environ['GITHUB_SHA'],
                         image=f"ghcr.io/{os.environ['IMAGE_OWNER']}/glc-validator@{os.environ['IMAGE_DIGEST']}")
          Path('validator-release.json').write_text(json.dumps(release, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Published validator {release['version']} from {release['commit']}\n\n`{release['image']}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validator-release
          path: validator-release.json
