name: Publish documentation from GLC framework
on:
  workflow_call:
    inputs:
      publish:
        description: Publish from the hosting repository after review.
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
jobs:
  build:
    # commonmarker 0.23.x does not compile with the Ubuntu 26.04 toolchain.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GlobalLightCommons/glc-framework
          ref: main
          persist-credentials: false
      - uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: viewer
      - uses: actions/configure-pages@v5
        id: pages
      - name: Check Sass map key compatibility
        working-directory: viewer
        run: bundle exec ruby tests/sass_number_equality.rb
      - name: Build documentation and viewer
        working-directory: viewer
        env:
          JEKYLL_ENV: production
        run: bundle exec ruby -r ./_plugins/sass_number_equality -S jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/_site
  deploy:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
