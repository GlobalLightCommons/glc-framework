name: Test proposed validator image
on:
  pull_request:
    paths: [".github/workflows/validator-image-check.yml", "validator/**"]
  push:
    branches: [main]
    paths: [".github/workflows/validator-image-check.yml", "validator/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build this revision without publishing
        uses: docker/build-push-action@v6
        with:
          context: validator
          platforms: linux/${{ matrix.architecture }}
          tags: glc-validator:proposed
          load: true
          push: false
      - name: Test the proposed validator
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker run --rm --platform "linux/$ARCHITECTURE" \
            -w /repo --entrypoint python glc-validator:proposed \
            -m unittest discover -s tests -v
      - name: Validate complete 3.0.2 and 3.1.0 packages with the container entrypoint
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          for schema in 3.0.2 3.1.0; do
            mkdir -p "$RUNNER_TEMP/validator-output/$schema"
            docker run --rm --platform "linux/$ARCHITECTURE" \
              -v "$RUNNER_TEMP/validator-output/$schema:/out" \
              -w "/repo/tests/fixtures/schema-$schema/pass" \
              -e VALIDATION_JSON=/out/validation.json \
              -e VALIDATION_MANIFEST=/out/validated-files-manifest.json \
              -e VALIDATOR_IMAGE=glc-validator:proposed \
              glc-validator:proposed datapackage.json
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for schema in ('3.0.2', '3.1.0'):
              report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'validator-output' / schema / 'validation.json').read_text())
              assert report['status'] == 'pass', report
              assert report['schema_version'] == schema, report
              assert report['validator_version'] == Path('validator/VERSION').read_text().strip(), report
              assert report['validator_image'] == 'glc-validator:proposed', report
              assert report['validation_scope'] == 'metadata_and_data', report
          PY
      - name: Prepare a metadata-only package
        run: |
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          package = Path(os.environ['RUNNER_TEMP']) / 'metadata-only'
          shutil.copytree('validator/tests/fixtures/schema-3.1.0/pass', package)
          path = package / 'data/datasets.json'
          rows = json.loads(path.read_text())
          for row in rows:
              row.pop('dataset_file', None)
              row.pop('dataset_variable_terms', None)
          path.write_text(json.dumps(rows))
          shutil.rmtree(package / 'data/datasets')
          PY
      - name: Validate metadata only with the container entrypoint
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/validator-output/metadata-only"
          docker run --rm --platform "linux/$ARCHITECTURE" \
            -v "$RUNNER_TEMP/metadata-only:/data:ro" \
            -v "$RUNNER_TEMP/validator-output/metadata-only:/out" -w /data \
            -e VALIDATION_JSON=/out/validation.json \
            -e VALIDATION_MANIFEST=/out/validated-files-manifest.json \
            glc-validator:proposed datapackage.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'validator-output/metadata-only/validation.json').read_text())
          assert report['status'] == 'pass', report
          assert report['validation_scope'] == 'metadata_only', report
          assert report['coverage']['metadata'] == 'pass', report
          assert report['coverage']['recordings'] == 'not_assessed', report
          PY
