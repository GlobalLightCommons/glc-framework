name: Initialize validation archive branch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the archive branch without changing main
        run: |
          if git ls-remote --exit-code --heads origin validation-archive; then
            echo 'validation-archive already exists; leaving it unchanged.'
            exit 0
          fi
          git switch --orphan validation-archive
          printf '# Signed validation evidence\n\nAppend-only archive; reports are reverified by the registry.\n' > README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Initialize signed validation archive'
          git push origin HEAD:refs/heads/validation-archive
