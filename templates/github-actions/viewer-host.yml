name: Publish viewer from GLC framework
on:
  workflow_dispatch:
  schedule:
    - cron: "12,27,42,57 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/jekyll.yml"]
  pull_request:
    paths: [".github/workflows/jekyll.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  framework:
    uses: GlobalLightCommons/glc-framework/.github/workflows/host-viewer.yml@main
    with:
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
